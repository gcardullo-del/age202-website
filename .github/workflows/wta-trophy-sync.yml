name: AGE202 WTA Trophy Cabinet Sync

on:
  schedule:
    - cron: "15 23 * * *"
      timezone: "Europe/Rome"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: age202-wta-trophy-cabinet-sync
  cancel-in-progress: false

jobs:
  sync-wta-trophy-cabinet:
    name: Sync WTA Trophy Cabinet
    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Europe/Rome

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Resolve current season
        id: season
        shell: bash
        run: |
          echo "year=$(date +%Y)" >> "$GITHUB_OUTPUT"

      - name: Sync WTA Trophy Cabinet
        run: |
          npx tsx scripts/sync-wta-trophy-wins.ts \
            --year=${{ steps.season.outputs.year }} \
            --write
