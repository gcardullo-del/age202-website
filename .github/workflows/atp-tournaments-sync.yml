name: AGE202 ATP Tournaments Sync

on:
  schedule:
    - cron: "0 8-22/2 * * *"
      timezone: "Europe/Rome"

    - cron: "30 23 * * *"
      timezone: "Europe/Rome"

  workflow_dispatch:

concurrency:
  group: age202-atp-tournaments-sync
  cancel-in-progress: false

jobs:
  sync-atp-tournaments:
    name: Sync ATP tournaments and finalize results
    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Sync ATP Masters 1000
        id: sync_masters_1000
        continue-on-error: true
        run: npx tsx scripts/sync-atp-masters-1000-live.ts --write

      - name: Sync ATP 500
        id: sync_atp_500
        if: always()
        continue-on-error: true
        run: npx tsx scripts/sync-atp-500-live.ts --write

      - name: Sync ATP 250
        id: sync_atp_250
        if: always()
        continue-on-error: true
        run: npx tsx scripts/sync-atp-250-live.ts --write

      - name: Finalize ATP tournaments from AGE202 database
        id: finalize_from_db
        if: always()
        continue-on-error: true
        run: npx tsx scripts/finalize-atp-tournaments-from-db.ts --write

      - name: Sync summary
        if: always()
        run: |
          echo "======================================"
          echo "AGE202 ATP TOURNAMENT SYNC SUMMARY"
          echo "======================================"
          echo ""
          echo "Masters 1000 external sync: ${{ steps.sync_masters_1000.outcome }}"
          echo "ATP 500 external sync:      ${{ steps.sync_atp_500.outcome }}"
          echo "ATP 250 external sync:      ${{ steps.sync_atp_250.outcome }}"
          echo "DB finalizer:               ${{ steps.finalize_from_db.outcome }}"
          echo ""
          echo "DB finalizer categories:"
          echo "  - Grand Slam"
          echo "  - Masters 1000"
          echo "  - ATP 500"
          echo ""
          echo "ATP 250 remains finalized by its dedicated sync."
          echo ""

          if [ "${{ steps.finalize_from_db.outcome }}" != "success" ]; then
            echo "❌ AGE202 DB tournament finalization failed."
            exit 1
          fi

          if [ "${{ steps.sync_masters_1000.outcome }}" != "success" ] || \
             [ "${{ steps.sync_atp_500.outcome }}" != "success" ] || \
             [ "${{ steps.sync_atp_250.outcome }}" != "success" ]; then
            echo "⚠️ One or more external ATP syncs reported an error."
            echo "The AGE202 DB finalizer still completed successfully."
          else
            echo "✅ All ATP tournament syncs and DB finalization completed successfully."
          fi
