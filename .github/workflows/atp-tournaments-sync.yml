name: AGE202 ATP Tournaments Sync

on:
  schedule:
    - cron: "0 8-22/2 * * *"
      timezone: "Europe/Rome"

    - cron: "30 23 * * *"
      timezone: "Europe/Rome"

  workflow_dispatch:

jobs:
  sync-atp-tournaments:
    name: Sync ATP 1000, 500 and 250
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Sync ATP Masters 1000
        id: sync_masters_1000
        continue-on-error: true
        run: npx tsx scripts/sync-atp-masters-1000-live.ts --write
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync ATP 500
        id: sync_atp_500
        if: always()
        continue-on-error: true
        run: npx tsx scripts/sync-atp-500-live.ts --write
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync ATP 250
        id: sync_atp_250
        if: always()
        continue-on-error: true
        run: npx tsx scripts/sync-atp-250-live.ts --write
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync summary
        if: always()
        run: |
          echo "======================================"
          echo "AGE202 ATP TOURNAMENT SYNC SUMMARY"
          echo "======================================"
          echo ""
          echo "Masters 1000: ${{ steps.sync_masters_1000.outcome }}"
          echo "ATP 500:      ${{ steps.sync_atp_500.outcome }}"
          echo "ATP 250:      ${{ steps.sync_atp_250.outcome }}"
          echo ""

          if [ "${{ steps.sync_masters_1000.outcome }}" != "success" ] || \
             [ "${{ steps.sync_atp_500.outcome }}" != "success" ] || \
             [ "${{ steps.sync_atp_250.outcome }}" != "success" ]; then
            echo "⚠️ One or more tournament syncs reported an error."
          else
            echo "✅ All ATP tournament syncs completed successfully."
          fi